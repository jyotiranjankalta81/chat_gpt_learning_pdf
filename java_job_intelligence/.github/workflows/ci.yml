name: CI
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: java_job_intelligence/package-lock.json
      - name: Install
        working-directory: java_job_intelligence
        run: npm ci
      - name: Typecheck
        working-directory: java_job_intelligence
        run: npm run typecheck
      - name: Test
        working-directory: java_job_intelligence
        run: npm run test
      - name: Build
        working-directory: java_job_intelligence
        run: npm run build
