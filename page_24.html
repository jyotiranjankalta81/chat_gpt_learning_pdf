<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FS-2</title>
    <style>
      :root {
        --bg: #fbf6ff;
        --purple: #5a2a86;
        --lav: #cdb7de;
        --card: #ffffff;
        --shadow: 0 18px 40px rgba(15, 10, 30, 0.08);
        --soft-shadow: 0 10px 24px rgba(15, 10, 30, 0.06);
        --radius-lg: 22px;
        --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: #1b1b1b;
      }

      .page_24_page {
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .page_24_bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .page_24_wave {
        position: absolute;
        left: -10vw;
        right: -10vw;
        height: 230px;
        border-bottom-left-radius: 65% 95%;
        border-bottom-right-radius: 65% 95%;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.04));
      }

      .page_24_wave--top {
        top: -40px;
        background: radial-gradient(150% 140% at 18% 0%, #ffd24b 0%, #ffd24b 46%, transparent 47%),
          linear-gradient(90deg, #ffffff 0%, #ffffff 52%, transparent 53%);
      }

      .page_24_wave--mid {
        top: -30px;
        height: 190px;
        background: radial-gradient(140% 140% at 72% 0%, var(--purple) 0%, var(--purple) 50%, transparent 51%);
        opacity: 0.98;
      }

      .page_24_header {
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 28px 48px 8px;
      }

      .page_24_brand__logo {
        width: min(210px, 38vw);
        height: auto;
      }

      .page_24_title {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 10px;
      }

      .page_24_title__kid {
        width: 116px;
        height: auto;
        transform: translateY(-2px);
      }

      .page_24_title__pill {
        background: var(--purple);
        color: #fff;
        padding: 14px 54px;
        border-radius: 999px;
        font-weight: 800;
        letter-spacing: 0.2px;
        font-size: clamp(22px, 2.2vw, 32px);
        box-shadow: var(--soft-shadow);
      }

      .page_24_content {
        position: relative;
        padding: 28px 56px 56px;
      }

      .page_24_grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 44px;
        align-items: start;
        max-width: 1120px;
        margin: 0 auto;
      }

      .page_24_right {
        display: grid;
        gap: 34px;
      }

      .page_24_card {
        background: var(--card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 26px;
        position: relative;
      }

      .page_24_card--tall {
        min-height: 720px;
      }

      .page_24_card--mid {
        min-height: 300px;
      }

      .page_24_card__placeholder {
        color: #b7a2c9;
        font-weight: 800;
        font-size: 22px;
        display: inline-block;
        margin-bottom: 10px;
      }

      .page_24_card__textarea {
        width: 100%;
        height: calc(100% - 38px);
        border: 0;
        outline: none;
        resize: none;
        font-size: 16px;
        line-height: 1.55;
        color: #2a2233;
        background: transparent;
      }

      .page_24_decor {
        position: absolute;
        pointer-events: none;
        user-select: none;
      }

      .page_24_decor--sheet {
        top: -10px;
        right: -22px;
        width: min(320px, 36vw);
        transform: rotate(6deg);
        filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.14));
      }

      .page_24_decor--star {
        width: 60px;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.12));
      }

      .page_24_decor--starLeft {
        left: 86px;
        top: 420px;
        width: 74px;
      }

      .page_24_decor--starRight {
        right: 186px;
        top: 420px;
        width: 56px;
      }

      @media (max-width: 980px) {
        .page_24_header {
          padding: 22px 20px 4px;
        }

        .page_24_content {
          padding: 24px 18px 46px;
        }

        .page_24_grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .page_24_card--tall {
          min-height: 420px;
        }

        .page_24_decor--sheet {
          opacity: 0.9;
          right: -8px;
        }

        .page_24_decor--starLeft,
        .page_24_decor--starRight {
          opacity: 0.95;
        }
      }
    </style>
  </head>
  <body>
    <main class="page_24_page" aria-label="FS-2 page">
      <div class="page_24_bg">
        <div class="page_24_wave page_24_wave--top"></div>
        <div class="page_24_wave page_24_wave--mid"></div>
      </div>

      <header class="page_24_header">
        <div class="page_24_brand" aria-label="Toondemy">
          <img class="page_24_brand__logo" src="./assets/toondemy-logo.svg" alt="TOONDEMY" />
        </div>

        <img class="page_24_decor page_24_decor--sheet" src="./assets/letter-h-sheet.svg" alt="" aria-hidden="true" />
      </header>

      <section class="page_24_title" aria-label="FS-2">
        <img class="page_24_title__kid" src="./assets/kid-green.svg" alt="" aria-hidden="true" />
        <div class="page_24_title__pill">
          <span>FS-2</span>
        </div>
      </section>

      <section class="page_24_content" aria-label="Observation inputs">
        <div class="page_24_grid">
          <label class="page_24_card page_24_card--tall" aria-label="Observation left">
            <span class="page_24_card__placeholder">Write your observation...</span>
            <textarea class="page_24_card__textarea" aria-label="Write your observation"></textarea>
          </label>

          <div class="page_24_right">
            <label class="page_24_card page_24_card--mid" aria-label="Observation right top">
              <span class="page_24_card__placeholder">Write your observation...</span>
              <textarea class="page_24_card__textarea" aria-label="Write your observation"></textarea>
            </label>

            <label class="page_24_card page_24_card--mid" aria-label="Observation right bottom">
              <span class="page_24_card__placeholder">Write your observation...</span>
              <textarea class="page_24_card__textarea" aria-label="Write your observation"></textarea>
            </label>
          </div>
        </div>

        <img class="page_24_decor page_24_decor--star page_24_decor--starLeft" src="./assets/star.svg" alt="" aria-hidden="true" />
        <img class="page_24_decor page_24_decor--star page_24_decor--starRight" src="./assets/star.svg" alt="" aria-hidden="true" />
      </section>
    </main>

    <script>
      function page24Autosize(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = Math.max(textarea.scrollHeight, 160) + "px";
      }

      for (const ta of document.querySelectorAll(".page_24_card__textarea")) {
        ta.addEventListener("input", () => page24Autosize(ta));
        page24Autosize(ta);
      }
    </script>
  </body>
</html>
