<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conclusion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page" aria-label="Conclusion page">
      <div class="bg">
        <div class="wave wave--top"></div>
        <div class="wave wave--mid"></div>
      </div>

      <header class="header">
        <div class="brand" aria-label="Toondemy">
          <img class="brand__logo" src="./assets/toondemy-logo.svg" alt="TOONDEMY" />
        </div>

        <img class="decor decor--star decor--star1" src="./assets/star.svg" alt="" aria-hidden="true" />
        <img class="decor decor--star decor--star2" src="./assets/star.svg" alt="" aria-hidden="true" />
        <img class="decor decor--folder" src="./assets/activity-folder.svg" alt="" aria-hidden="true" />
      </header>

      <section class="title" aria-label="Conclusion">
        <img class="title__kid" src="./assets/kid-green.svg" alt="" aria-hidden="true" />
        <div class="title__pill">
          <span>Conclusion</span>
        </div>
      </section>

      <section class="content" aria-label="Conclusion inputs">
        <div class="grid">
          <label class="card" aria-label="Conclusion left">
            <span class="card__placeholder">Write your conclusion...</span>
            <textarea class="card__textarea" placeholder="" aria-label="Write your conclusion"></textarea>
          </label>

          <div class="right">
            <label class="card" aria-label="Conclusion right">
              <span class="card__placeholder">Write your conclusion...</span>
              <textarea class="card__textarea" placeholder="" aria-label="Write your conclusion"></textarea>
            </label>

            <article class="signature" aria-label="Signature">
              <div class="signature__body">
                <div class="signature__left">
                  <div class="signature__label">Signature</div>
                  <div class="signature__box" role="img" aria-label="Signature image">
                    <img src="./assets/signature-sample.svg" alt="" aria-hidden="true" />
                  </div>
                </div>

                <dl class="signature__meta" aria-label="Signer information">
                  <div class="signature__field">
                    <dt class="signature__k">Name</dt>
                    <dd class="signature__v">Anjali Kumari</dd>
                  </div>
                  <div class="signature__field">
                    <dt class="signature__k">Designation</dt>
                    <dd class="signature__v">Teacher</dd>
                  </div>
                </dl>
              </div>
            </article>
          </div>
        </div>

        <img class="decor decor--boy" src="./assets/boy-exam.svg" alt="" aria-hidden="true" />
        <img class="decor decor--grad" src="./assets/graduate.svg" alt="" aria-hidden="true" />
      </section>
    </main>

    <script src="./main.js" defer></script>
  </body>
</html>
